name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rcwa
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: rcwa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rcwa"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      TEST_POSTGRES_URL: postgresql+psycopg://rcwa:ci-only@localhost:5432/rcwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-mcp-lock.txt
      - run: pip check
      - run: ruff check backend scripts/start_local.py scripts/local_runtime.py scripts/local_windows.py scripts/tests/*.py scripts/tests/fixtures/*.py
      - run: PYTHONPATH=backend pytest backend/tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Check real Linux local-launcher lifecycle
        env:
          RCWA_LAUNCHER_LOG_DIR: artifacts/local-startup-linux
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python -m pytest scripts/tests/test_local_startup.py -q --junitxml=artifacts/local-startup-linux.xml 2>&1 | tee artifacts/local-startup-linux.log
      - name: Retain Linux launcher logs and numerical-entry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-startup-linux
          path: artifacts/local-startup-linux*
          retention-days: 7
          if-no-files-found: warn
  mcp-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-mcp-lock.txt
      - run: python -m pip check
      - run: python -m pytest backend/tests/test_mcp_adapter.py -q
      - name: Check real SDK stdio client and local HTTP validation
        run: python -m pytest backend/tests/test_mcp_protocol.py -q -k "stdio_discovery_and_validation or stdio_closes_on_eof or api_down"
      - name: Check explicit 2D contracts and bounded stdio recovery
        env:
          RCWA_STDIO_DIAGNOSTIC_DIR: artifacts/windows-stdio-stacks
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          python -m pytest backend/tests/test_2d_mcp_contracts.py backend/tests/test_2d_mcp_transport.py backend/tests/test_mcp_summaries.py backend/tests/test_mcp_saved_design_reuse.py backend/tests/test_mcp_2d_change_preview.py -q --junitxml=artifacts/windows-mcp-2d.xml 2>&1 | Tee-Object -FilePath artifacts/windows-mcp-2d.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Check real Windows local-launcher lifecycle
        env:
          RCWA_LAUNCHER_LOG_DIR: artifacts/local-startup-windows
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          python -m pytest scripts/tests/test_local_startup.py -q --junitxml=artifacts/local-startup-windows.xml 2>&1 | Tee-Object -FilePath artifacts/local-startup-windows.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain Windows launcher logs and numerical-entry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-startup-windows
          path: artifacts/local-startup-windows*
          retention-days: 7
          if-no-files-found: warn
      - name: Retain Windows transport diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-mcp-2d
          path: |
            artifacts/windows-mcp-2d.*
            artifacts/windows-stdio-stacks/*.txt
          retention-days: 7
          if-no-files-found: warn

  independent-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - run: pip install -r backend/requirements-lock.txt
      - name: Prepare official pinned S4 reference
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y g++ make liblapack-dev libblas-dev
          git init /tmp/rcwa-s4-upstream
          git -C /tmp/rcwa-s4-upstream remote add origin https://github.com/victorliu/S4.git
          git -C /tmp/rcwa-s4-upstream fetch --depth 1 origin 7fd00a231610bff51f5c7de5f723e3956eab7453
          git -C /tmp/rcwa-s4-upstream checkout --detach FETCH_HEAD
      - name: Compare real application powers with independent S4
        run: |
          mkdir -p artifacts
          python scripts/reference_check.py --s4-source /tmp/rcwa-s4-upstream --output artifacts/independent-reference.json
      - name: Check independent 2D ports and channels (Laurent diagnostic only)
        run: python scripts/true_2d_reference.py --s4-source /tmp/rcwa-s4-upstream --output artifacts/true-2d-laurent.json.gz
      - name: Check genuine 2D production convergence with multiple open channels
        run: >-
          python scripts/true_2d_gate.py
          --project backend/tests/fixtures/true-2d/representative/multiple-open-channels.json
          --s4-source /tmp/rcwa-s4-upstream
          --output artifacts/true-2d-multiple-open-channels.json.gz
      - name: Check genuine 2D production convergence with eight lossy layers
        run: >-
          python scripts/true_2d_gate.py
          --project backend/tests/fixtures/true-2d/representative/lossy-mixed-eight-layer.json
          --s4-source /tmp/rcwa-s4-upstream
          --first-refinement 7,6 --second-refinement 9,8
          --output artifacts/true-2d-lossy-eight-layer.json.gz
      - name: Retain independent numerical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-reference
          path: |
            artifacts/independent-reference.json
            artifacts/true-2d-*.json.gz
            /tmp/rcwa-s4-upstream/build/rcwa_reference/build.log
            /tmp/rcwa-s4-upstream/build/rcwa_reference/link.log
            /tmp/rcwa-s4-upstream/build/rcwa_reference_2d/link.log
          retention-days: 7
          if-no-files-found: warn

  circular-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - run: pip install -r backend/requirements-lock.txt
      - name: Prepare official pinned S4 circle reference
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y g++ make liblapack-dev libblas-dev
          git init /tmp/rcwa-s4-upstream
          git -C /tmp/rcwa-s4-upstream remote add origin https://github.com/victorliu/S4.git
          git -C /tmp/rcwa-s4-upstream fetch --depth 1 origin 7fd00a231610bff51f5c7de5f723e3956eab7453
          git -C /tmp/rcwa-s4-upstream checkout --detach FETCH_HEAD
      - name: Check circular spatial and harmonic convergence against exact S4 circles
        run: >-
          python scripts/circular_gate.py
          --s4-source /tmp/rcwa-s4-upstream
          --output artifacts/circular-reference.json.gz
      - name: Retain independent circular evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: circular-reference
          path: |
            artifacts/circular-reference.json.gz
            /tmp/rcwa-s4-upstream/build/rcwa_reference_2d/link.log
          retention-days: 7
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test fail-closed Pages evidence gate
        run: node --test ../scripts/tests/pages_evidence_gate.test.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Check the in-browser engine (Pyodide) against frozen native results
        run: npm run test:engine

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements-lock.txt
      - name: Check generated frontend reference inputs
        run: |
          python scripts/build_2d_ui_reference.py --check
          python scripts/build_circular_ui_reference.py --check
          python scripts/generate_frontend_2d_conformance.py --check
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Warm the local Pyodide package cache used by the browser tests
        run: npm run test:engine
        working-directory: frontend
      - name: End-to-end checks on the static build, in-browser and with a local server
        run: npm run e2e
        working-directory: frontend
        env:
          RCWA_E2E_PYTHON: python
      - name: Retain traces and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore
