name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rcwa
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: rcwa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rcwa"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      TEST_POSTGRES_URL: postgresql+psycopg://rcwa:ci-only@localhost:5432/rcwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-mcp-lock.txt
      - run: pip check
      - run: ruff check backend
      - run: PYTHONPATH=backend pytest backend/tests -q
  mcp-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-mcp-lock.txt
      - run: python -m pip check
      - run: python -m pytest backend/tests/test_mcp_adapter.py -q
      - name: Check real SDK stdio client and local HTTP validation
        run: python -m pytest backend/tests/test_mcp_protocol.py -q -k "stdio_discovery_and_validation or stdio_closes_on_eof or api_down"

  independent-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - run: pip install -r backend/requirements-lock.txt
      - name: Prepare official pinned S4 reference
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y g++ make liblapack-dev libblas-dev
          git init /tmp/rcwa-s4-upstream
          git -C /tmp/rcwa-s4-upstream remote add origin https://github.com/victorliu/S4.git
          git -C /tmp/rcwa-s4-upstream fetch --depth 1 origin 7fd00a231610bff51f5c7de5f723e3956eab7453
          git -C /tmp/rcwa-s4-upstream checkout --detach FETCH_HEAD
      - name: Compare real application powers with independent S4
        run: |
          mkdir -p artifacts
          python scripts/reference_check.py --s4-source /tmp/rcwa-s4-upstream --output artifacts/independent-reference.json
      - name: Retain independent numerical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-reference
          path: |
            artifacts/independent-reference.json
            /tmp/rcwa-s4-upstream/build/rcwa_reference/build.log
            /tmp/rcwa-s4-upstream/build/rcwa_reference/link.log
          retention-days: 7
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run lint

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      DATABASE_URL: sqlite:////tmp/rcwa-browser-ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements-lock.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_STATIC_PREVIEW: 'true'
      - name: Check live solver and mobile static preview
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=backend python -m uvicorn api.main:app --host 127.0.0.1 --port 8000 > /tmp/rcwa-api.log 2>&1 &
          api_pid=$!
          (cd frontend && npm run dev -- --strictPort) > /tmp/rcwa-vite.log 2>&1 &
          vite_pid=$!
          python -m http.server 4173 --bind 127.0.0.1 --directory frontend/dist > /tmp/rcwa-static.log 2>&1 &
          static_pid=$!
          trap 'kill "$api_pid" "$vite_pid" "$static_pid" 2>/dev/null || true' EXIT
          for url in http://127.0.0.1:8000/api/health http://127.0.0.1:5173 http://127.0.0.1:4173; do
            ready=false
            for attempt in $(seq 1 60); do
              if curl --fail --silent "$url" > /dev/null; then ready=true; break; fi
              sleep 0.5
            done
            if [ "$ready" != true ]; then
              cat /tmp/rcwa-api.log /tmp/rcwa-vite.log /tmp/rcwa-static.log
              exit 1
            fi
          done
          timeout 60s python scripts/agent_example.py --deadline-seconds 45
          (cd frontend && timeout 240s node scripts/browser-qa.mjs)
          (cd frontend && timeout 180s node scripts/snapshot-browser-qa.mjs)
          (cd frontend && timeout 180s node scripts/contract-browser-qa.mjs)
          (cd frontend && timeout 240s node scripts/workflow-browser-qa.mjs)
          (cd frontend && timeout 240s node scripts/multilayer-browser-qa.mjs)
      - name: Collect local browser server logs
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          for log in /tmp/rcwa-api.log /tmp/rcwa-vite.log /tmp/rcwa-static.log; do
            if [ -f "$log" ]; then cp "$log" artifacts/; fi
          done
      - name: Retain screenshots and browser assertions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa
          path: |
            artifacts/*.png
            artifacts/browser-qa.json
            artifacts/snapshot-browser-qa.json
            artifacts/contract-browser-qa.json
            artifacts/workflow-browser-qa.json
            artifacts/multilayer-browser-qa.json
            artifacts/agent-report.json
            artifacts/rcwa-*.log
          retention-days: 1
          if-no-files-found: warn
