services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rcwa
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: rcwa
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - rcwa-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rcwa"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  rcwa-data:
